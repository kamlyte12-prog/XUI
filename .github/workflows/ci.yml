name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     san: OFF }
          - { os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     san: ON  }   # ASan + UBSan
          - { os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, san: OFF }
          - { os: macos-14,      cc: "",       cxx: "",        san: OFF }
          - { os: windows-2022,  cc: "",       cxx: "",        san: OFF }   # MSVC /W4 /WX
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          [ -n "${{ matrix.cxx }}" ] && export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DXUI_SANITIZE=${{ matrix.san }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
