name: ci
on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc13,     os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     san: "OFF", werror: "ON",  flags: "" }
          - { name: linux-gcc13-san, os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     san: "ON",  werror: "OFF", flags: "" }  # ASan + UBSan
          - { name: linux-clang18,   os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, san: "OFF", werror: "ON",  flags: "-stdlib=libc++" }
          - { name: macos-14,        os: macos-14,     cc: "",       cxx: "",          san: "OFF", werror: "ON",  flags: "" }
          - { name: windows-2022,    os: windows-2022, cc: "",       cxx: "",          san: "OFF", werror: "ON",  flags: "" }  # MSVC /W4 /WX
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache bundled dependency builds
        uses: actions/cache@v4
        with:
          path: |
            build/_deps/freetype
            build/_deps/harfbuzz
            build/_deps/lunasvg
          key: xui-deps-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'libs/freetype-2.15.0/**', 'libs/harfbuzz-15.0.0/**', 'libs/lunasvg-3.5.0/**') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl-dev xorg-dev libc++-18-dev libc++abi-18-dev \
            fonts-dejavu-core fonts-liberation2

      - name: Relax ASLR for ASan
        if: runner.os == 'Linux' && matrix.san == 'ON'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          EXTRA=""
          # Build only GLFW's X11 backend on Linux; Wayland needs extra packages.
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="$EXTRA -DGLFW_BUILD_WAYLAND=OFF"; fi
          # Only override CMAKE_CXX_FLAGS when needed; an empty override drops MSVC's /EHsc.
          if [ -n "${{ matrix.flags }}" ]; then EXTRA="$EXTRA -DCMAKE_CXX_FLAGS=${{ matrix.flags }}"; fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXUI_BUILD_TESTS=ON \
            -DXUI_BUILD_BENCHMARKS=OFF \
            -DXUI_BUILD_EXAMPLES=ON \
            -DXUI_BUILD_GLFW_EXAMPLE=ON \
            -DXUI_WERROR=${{ matrix.werror }} \
            -DXUI_SANITIZE=${{ matrix.san }} \
            $EXTRA

      - name: Build
        # Exercise the public app, optional adapters, and the authored Tetris sample.
        run: cmake --build build --config Debug --parallel --target xui_tests xui_glfw_demo xui_game_demo

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          if ! ctest --test-dir build -C Debug --output-on-failure; then
            echo "=============== ctest failed: running test binary directly from repo root ==============="
            exe=$(find build -type f \( -name xui_tests -o -name xui_tests.exe \) | head -1)
            echo "binary: $exe"
            "$exe"
            echo "exit code: $?"
            exit 1
          fi

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format 22.1.3
        run: |
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install --quiet clang-format==22.1.3
          echo "$RUNNER_TEMP/format-venv/bin" >> "$GITHUB_PATH"

      - name: Check changed C++ lines
        run: |
          # Check only lines touched by this push/PR. The existing sources
          # predate .clang-format, so a whole-tree check would fail on them.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            range="$base...HEAD"
          else
            base="${{ github.event.before }}"
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
                base="$(git rev-parse HEAD^)"
              else
                base="$(git rev-list --max-parents=0 HEAD | tail -1)"
              fi
            fi
            range="$base..HEAD"
          fi
          echo "Checking formatting since $base"
          changed="$(git diff --name-only -M "$range" -- '*.cpp' '*.hpp' '*.h' ':(exclude)libs/**')"
          if [ -z "$changed" ]; then
            echo "No project C++ files changed."
            exit 0
          fi
          git diff -U0 -M "$range" -- '*.cpp' '*.hpp' '*.h' ':(exclude)libs/**' \
            | clang-format-diff -p1 -style=file

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 clang-tidy-18 ninja-build pkg-config

      - name: Configure
        run: |
          cmake -S . -B build/tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DXUI_BUILD_TESTS=OFF \
            -DXUI_BUILD_BENCHMARKS=OFF \
            -DXUI_BUILD_FUZZERS=OFF \
            -DXUI_BUILD_EXAMPLES=OFF \
            -DXUI_BUILD_GLFW_EXAMPLE=OFF \
            -DXUI_WERROR=OFF

      - name: Run clang-tidy
        run: |
          git ls-files -z -- 'src/**/*.cpp' \
            | xargs -0 -n 1 -P "$(nproc)" clang-tidy-18 -p build/tidy --quiet --warnings-as-errors='*'

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Relax ASLR for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXUI_BUILD_TESTS=OFF \
            -DXUI_BUILD_BENCHMARKS=OFF \
            -DXUI_BUILD_EXAMPLES=OFF \
            -DXUI_BUILD_GLFW_EXAMPLE=OFF \
            -DXUI_BUILD_FUZZERS=ON \
            -DXUI_WERROR=OFF \
            -DXUI_SANITIZE=ON

      - name: Build fuzzers
        run: cmake --build build/fuzz --parallel --target fuzz_parsers fuzz_layout fuzz_paint

      - name: Run fuzz smoke checks
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          build/fuzz/fuzz_parsers 3000 12345
          build/fuzz/fuzz_layout 1 300 10
          build/fuzz/fuzz_paint 1 300 50

  install-consumer:
    name: install-consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config

      - name: Build and install Xui
        run: |
          cmake -S . -B build/install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXUI_BUILD_TESTS=OFF \
            -DXUI_BUILD_BENCHMARKS=OFF \
            -DXUI_BUILD_FUZZERS=OFF \
            -DXUI_BUILD_EXAMPLES=OFF \
            -DXUI_BUILD_GLFW_EXAMPLE=OFF \
            -DXUI_INSTALL=ON \
            -DXUI_WERROR=OFF
          cmake --build build/install --parallel
          cmake --install build/install --prefix "$RUNNER_TEMP/xui-prefix"

      - name: Check the package for source-tree paths
        run: |
          if grep -R --line-number --binary-files=without-match "$GITHUB_WORKSPACE" "$RUNNER_TEMP/xui-prefix"; then
            echo "installed package references the source/build tree" >&2
            exit 1
          fi

      - name: Build and run the package consumer
        run: |
          cmake -S cmake/package-consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/xui-prefix"
          cmake --build build/consumer --parallel
          ./build/consumer/xui_package_consumer
