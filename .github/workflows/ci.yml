name: ci
on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc13,     os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     san: "OFF", werror: "ON",  flags: "" }
          - { name: linux-gcc13-san, os: ubuntu-24.04, cc: gcc-13,   cxx: g++-13,     san: "ON",  werror: "OFF", flags: "" }  # ASan + UBSan
          - { name: linux-clang18,   os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, san: "OFF", werror: "ON",  flags: "-stdlib=libc++" }
          - { name: macos-14,        os: macos-14,     cc: "",       cxx: "",          san: "OFF", werror: "ON",  flags: "" }
          - { name: windows-2022,    os: windows-2022, cc: "",       cxx: "",          san: "OFF", werror: "ON",  flags: "" }  # MSVC /W4 /WX
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl-dev xorg-dev libc++-18-dev libc++abi-18-dev \
            fonts-dejavu-core fonts-liberation2

      - name: Relax ASLR for ASan
        if: runner.os == 'Linux' && matrix.san == 'ON'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          EXTRA=""
          # Build only GLFW's X11 backend on Linux; Wayland needs extra packages.
          if [ "$RUNNER_OS" = "Linux" ]; then EXTRA="-DGLFW_BUILD_WAYLAND=OFF"; fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXUI_BUILD_TESTS=ON \
            -DXUI_BUILD_BENCHMARKS=OFF \
            -DXUI_BUILD_EXAMPLES=ON \
            -DXUI_WERROR=${{ matrix.werror }} \
            -DXUI_SANITIZE=${{ matrix.san }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            $EXTRA

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          if ! ctest --test-dir build -C Debug --output-on-failure; then
            echo "=============== ctest failed: running test binary directly from repo root ==============="
            exe=$(find build -type f \( -name xui_tests -o -name xui_tests.exe \) | head -1)
            echo "binary: $exe"
            "$exe"
            echo "exit code: $?"
            exit 1
          fi